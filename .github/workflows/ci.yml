name: Acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Django and task lifecycle tests
        working-directory: backend
        run: python manage.py test api optiroute_config
      - name: C++ engine, bindings and API integration
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine --parallel 2
          ctest --test-dir build/engine --output-on-failure
      - name: Build runtime image
        run: docker build --target runtime -t optiroute-ci:tested .
      - name: Production HTTPS, Redis and Celery acceptance
        run: bash scripts/deployment-ci.sh
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag optiroute-ci:tested "$image"
          docker push "$image"
          docker logout ghcr.io
          printf 'Published tested image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Failure logs
        if: failure()
        run: |
          if [ -f deploy/.env.production ]; then
            APP_IMAGE=optiroute-ci:tested docker compose --env-file deploy/.env.production -f deploy/compose.yml logs --no-color
          fi
          docker logs optiroute-proxy-ci 2>/dev/null || true
      - name: Cleanup disposable CI services
        if: always()
        run: |
          docker rm -fv optiroute-proxy-ci 2>/dev/null || true
          if [ -f deploy/.env.production ]; then
            APP_IMAGE=optiroute-ci:tested docker compose --env-file deploy/.env.production -f deploy/compose.yml down -v
          fi
